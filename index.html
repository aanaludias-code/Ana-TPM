<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Herdeiro Genético: A Linhagem Perdida — jogo educativo de genética para estudantes de Biologia, Biomedicina, Medicina e Veterinária." />
  <title>Herdeiro Genético: A Linhagem Perdida</title>

  <!-- Fonts: display (Cinzel), body serif (EB Garamond), handwritten note (Caveat) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/game.css" />
</head>
<body>
  <!-- Decorative parchment / vignette layers -->
  <div class="bg-parchment" aria-hidden="true"></div>
  <div class="bg-vignette" aria-hidden="true"></div>

  <!-- The whole game renders into here -->
  <main id="app" role="main"></main>

  <!-- Toast / feedback layer -->
  <div id="toast-layer" aria-live="polite"></div>

  <noscript>
    <div style="padding:2rem;text-align:center;font-family:serif">
      Este jogo precisa de JavaScript ativado para funcionar.
    </div>
  </noscript>

  <script type="module" src="js/main.js"></script>

</html>
